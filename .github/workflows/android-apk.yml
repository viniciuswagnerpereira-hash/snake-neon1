name: Android APK
# Runtime validation includes emulator boot + game start.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Smoke test Supabase
        env:
          SUPABASE_URL: https://qlvmlsbbdpdlbnfpyrvd.supabase.co
          SUPABASE_KEY: sb_publishable_Whxrjns4n-TBWToFNZ0usA_HidOxQom
        run: |
          set -euo pipefail

          curl --fail --silent --show-error             "$SUPABASE_URL/rest/v1/game_scores?select=nickname,score&order=score.desc&limit=5"             -H "apikey: $SUPABASE_KEY" >/tmp/leaderboard.json

          code="$(curl --silent --output /tmp/direct-write.json --write-out '%{http_code}'             -X POST "$SUPABASE_URL/rest/v1/game_scores"             -H "apikey: $SUPABASE_KEY"             -H "Content-Type: application/json"             -d '{"nickname":"CI_DIRECT","score":1,"kills":0,"duration_ms":1000,"app_version":"ci"}')"
          test "$code" = "401" -o "$code" = "403"

          curl --fail --silent --show-error             -X POST "$SUPABASE_URL/functions/v1/submit-score"             -H "apikey: $SUPABASE_KEY"             -H "Content-Type: application/json"             -d '{"nickname":"CI_SMOKE","score":1,"kills":0,"duration_ms":1000,"app_version":"ci","dry_run":true}'             | grep -q '"dry_run":true'

      - name: Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK structure
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          apkanalyzer manifest application-id app/build/outputs/apk/debug/app-debug.apk
          apkanalyzer apk summary app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Package ZIP
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SerpenteNeon.apk
          (cd dist && zip -9 SerpenteNeon-Android.zip SerpenteNeon.apk)
          unzip -t dist/SerpenteNeon-Android.zip
          sha256sum dist/SerpenteNeon-Android.zip

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: serpente-neon-android
          path: |
            dist/SerpenteNeon.apk
            dist/SerpenteNeon-Android.zip
          if-no-files-found: error
          retention-days: 30


  runtime-smoke-test:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: serpente-neon-android
          path: runtime-artifact

      - name: Boot Android and launch game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            test -s runtime-artifact/SerpenteNeon.apk

            adb install -r runtime-artifact/SerpenteNeon.apk
            adb logcat -c

            adb shell am force-stop com.serpenteneon.game
            adb shell am start -W -n com.serpenteneon.game/.MainActivity --ez smoke_test true

            sleep 8

            test -n "$(adb shell pidof com.serpenteneon.game | tr -d '\r')"

            adb shell dumpsys activity activities | grep -q 'com.serpenteneon.game/.MainActivity'

            adb logcat --pid="$(adb shell pidof com.serpenteneon.game | tr -d '\r')" -d > runtime-logcat.txt
            cat runtime-logcat.txt

            grep -q 'DOM_READY=true' runtime-logcat.txt
            grep -q 'GAME_START=true' runtime-logcat.txt

            ! grep -q 'MAIN_FRAME_ERROR=' runtime-logcat.txt
            ! grep -q 'JS_ERROR=' runtime-logcat.txt
            ! grep -q 'FATAL EXCEPTION' runtime-logcat.txt
